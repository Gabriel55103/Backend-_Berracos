spring.application.name=berracos
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/Barberia
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:ZGV2LWRlbW8tc2VjcmV0LWtleS1mb3Itand0LTIwMjYtYXBw}
app.jwt.expiration-ms=3600000

server.error.include-message=always
server.error.include-binding-errors=always

spring.jackson.time-zone=America/Mexico_City
app.admin.nombre=Administrador
app.admin.correo=admin@berracos.com
app.admin.password=AdminBerracos

app.upload.dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB